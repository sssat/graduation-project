server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:newsight}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:newsight}
    password: ${DB_PASSWORD:newspass}

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "baseline (pre-existing schema)"

  mail:
    host: ${SPRING_MAIL_HOST:${NAVER_SMTP_HOST:smtp.naver.com}}
    port: ${SPRING_MAIL_PORT:${NAVER_SMTP_PORT:465}}
    username: ${SPRING_MAIL_USERNAME:${NAVER_USER:}}
    password: ${SPRING_MAIL_PASSWORD:${NAVER_APP_PASS:}}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:15000}
          timeout: ${SPRING_MAIL_TIMEOUT:15000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:15000}
    default-encoding: UTF-8

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:5174"
      - "http://127.0.0.1:5174"
      - "http://localhost:5175"
      - "http://127.0.0.1:5175"
      - "https://newsightkr.com"
      - "https://www.newsightkr.com"

    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"

    allow-credentials: true

  precheck:
    secret: ${APP_PRECHECK_SECRET:change-me-precheck-secret}
    ttl-seconds: ${APP_PRECHECK_TTL_SECONDS:600}

  allowed-email-domains: ${APP_ALLOWED_EMAIL_DOMAINS:gmail.com,naver.com,kakao.com}

  mail:
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:${NAVER_USER:}}}

  jwt:
    secret: ${JWT_SECRET:change-me-please-32bytes-minimum}
    issuer: ${JWT_ISSUER:newsight}
    audience: ${JWT_AUDIENCE:newsight}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-minutes: ${JWT_REFRESH_MINUTES:60}
    user-id-claim: ${JWT_USER_ID_CLAIM:user_seq}

  analytics:
    trend-run-offset: ${ANALYTICS_TREND_RUN_OFFSET:0}

management:
  health:
    mail:
      enabled: false

logging:
  level:
    "org.springframework.security": INFO
    "org.springframework.security.oauth2": INFO
