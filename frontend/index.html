<!-- 
 [Git 커밋하는 법]
 0. 브랜치 구조
  (1) main 
  - 최종 제출 / 실제 서버 배포용
  - 항상 배포 가능한 상태만 올라가야 함
  - 직접 여기서 개발하지 말고 항상 feature -> develop -> main 순으로 머지

  (2) develop
  - 통합 개발용 / 테스트용
  - 여러 작업(feature 브랜치들)을 먼저 여기서 합쳐보고 문제 없으면 develop -> main 으로 머지

  (3) feature 브랜치들
  - 작업 단위로 따서 쓰기
  - 예를들어 프론트 작업한다면 메인 페이지: feature/frontend-main-page, 로그인 페이지: feature/frontend-login-page, .... 이런식으로 분할
  - 무조건 develop에서 분기해서 -> 여기 feature에서 작업 후 -> 다시 develop으로 머지
  - 작업 다 끝나서 develop 브랜치에 머지했으면 feature 브랜치들은 삭제하기
  - 나 같은 경우는 현재 graduation-project 레포지토리 내부에 frontend, data-pipeline, backend의 총 3개의 프로젝트가 존재하므로,
    feature 브랜치를 feature/frontend-main-page, feature/frontend-login-page, feature/backend-accounts,
    feature/backend-inquiries, feature/data-pipeline-xxx, feature/data-pipeline-xxx, .... 이런식으로 따고
    작업이 완료되서 develop에 머진한 후 이 feautre 브랜치들을 전부 삭제하는 방향으로 진행하면 된다.
    따라서 머지된 feature 브랜치는 삭제해서 보통 main/develop만 상시 남게 된다.

  (4) 브랜치 전체 구조
  - develop은 main에서 갈라져 나왔고
  - feature/frontend-layout와 같은 각 feature들은 develop에서 갈라져 나왔다.


 1. 맨 처음 깃 초기화 + 첫 커밋 => 이건 레포지토리 생성 후 첫번째 프로젝트(여기선 frontend) 생성 후 맨 처음 한 번만 하면 됨
  (1) 프로젝트 루트(graduation-project)에서 Git 초기화
  - git init                                                      : 지금 폴더(graduation-project)를 Git 저장소로 초기화하는 명령어
  - git add .                                                     : 새로 만든 파일, 수정, 삭제 모두 스테이징
  - git commit -m "chore: Vue 사용자/관리자 프로젝트 초기 설정"     : 지금까지 스테이징 한 변경사항을 하나의 버전(스냅샷)으로 저장

  (2) main 브랜치 이름을 main으로 정하기 (지금 브랜치 이름을 main으로 강제 변경)
  - git branch -M main

  (3) develop 브랜치 생성(-b) + 그 브랜치로 이동(checkout)
  - git checkout -b develop

  (4) GitHub에 리포 만들고 원격 연결 후 푸시
  - git remote add origin <리포_URL>        : 내 로컬 Git 프로젝트를 GitHub 리포와 연결
  - git push -u origin main                 : 로컬 main 브랜치를 GitHub(origin)에 처음 올리고, 연결 관계까지 설정
  - git push -u origin develop              : develop 브랜치도 GitHub에 처음 올리고, 기본 연결 설정


 2. 이후 실제 작업 흐름 (작업 단위(feature)가 달라질때마다 매번 이 짓을 하면 된다 -> EC2에서 작업할때도 동일하게 하면됨)
  (0) 프로젝트 루트(graduation-project)로 이동 
  - cd C:\Users\leehk\graduation-project : 로컬
  - cd /opt/graduation-project : EC2

  (1) 항상 develop으로 먼저 이동해서 최신 상태로 맞춘다 (새 feature 작업을 시작할 때마다 매번 한번씩만 해주면된다)
  - git checkout develop               : 이미 있는 develop 브랜치로 이동(checkout)
  - git pull origin develop            : 원격 develop 최신 상태 가져오기

  (1)-1 EC2에서 작업하는 경우 내 깃 닉네임과 액세스 토큰 입력
 
  (2) 새로운 작업 브랜치 생성(-b) + 그 브랜치로 이동(checkout)
  - git checkout -b feature/frontend-layout (이 브랜치에서는 Header / Footer / AppLayout 등의 공통 레이아웃 관련 코드들을 작업 할 예정)
  
  (2-1) 이미 존재하는 작업 브랜치로 이동 (이건 매번 해줘야한다. 하지만 브랜치를 이동하지 않는 이상 전원을 꺼도 이 브랜치에 있을것이기 때문에 대부분의 경우 안해도 된다.)
  - git checkout feature/frontend-layout

  (2-2) 이미 존재하는 작업 브랜치로 다시 이동할때는 develop 브랜치를 머지 해줘야 최신 내용이 해당 브랜치에 덮어씌워진다. 새롭게 브랜치를 생성(-b)한 상황이라면 안해도 된다.
  - git merge develop    

  (3) 새로운 작업 브랜치 생성 후 첫 커밋 + 첫 푸시
  - git status                                             : 지금 어느 브랜치에 있는지, 어떤 파일이 수정/추가되었고, 어떤 파일이 스테이징 됐는지(add 됐는지) 보여주는 명령어
  - git add .                                              : 새로 만든 파일, 수정, 삭제 모두 스테이징
  - git commit -m "feat: ~~ 기능 추가"
  - git push -u origin feature/frontend-layout        : 지금 브랜치(feature/frontend-layout)에 있는 커밋들을 GitHub(원격 origin)의 같은 이름 브랜치로 처음 업로드

  (3-1) 그 이후 그날 그날 작업 후 매일 커밋 + 푸시
  - git status
  - git add . (아니면 git add index.html, git add src/main.ts, ... 이런식으로 해당 브랜치에 맞는 파일만 커밋)
  - git add -u                                             : 기존에 있던 파일의 수정/삭제만 스테이징(새 파일은 제외)
  - git commit -m "feat: ~~ 기능 추가"
  - git push                                               : 이미 한 번 git push -u origin feature/frontend-layout 를 했기 때문에 이 브랜치의 원격 대상은 origin/feature/frontend-layout으로 저장되어 있음. 그래서 그 다음부터는 그냥 git push만 쳐도 알아서 같은 브랜치로 올라감

  (4) feature 브랜치에서 이번에 develop으로 올리고 싶은 기능 단위가 안정적으로 동작하면 develop에 합치기
    1) 프로젝트 루트(graduation-project)로 이동
    - cd C:\Users\leehk\graduation-project : 로컬
    - cd /opt/graduation-project : EC2

    2) develop 브랜치로 이동
    - git checkout develop

    3) 원격 develop 브랜치로부터 내 로컬로 최신 내용(develop 브랜치의 내용) 가져오기
    - git pull origin develop

    4) 레이아웃 브랜치를 develop 브랜치에 머지
    - git merge feature/frontend-layout

    5) 머지 잘 됐으면 develop 브랜치 푸쉬
    - git push origin develop

  (5) PR 머지 후 브랜치 정리 (선택 사항)
  - git branch -d feature/frontend-layout        : 로컬에서만 브랜치 레퍼런스를 삭제. 이 명령어는 내 컴퓨터에서만 브랜치 목록을 정리하는 용도

  (6) 로컬 develop 브랜치 최신으로 맞추기
  graduation-project 루트에서
  - git checkout develop
  - git pull origin develop
  => 여기까지 했으면 이제 다시 (1)번으로 돌아가서 새로운 feature 브랜치 생성해서 작업하면 된다.


  2-1. develop 브랜치에서 간단한 수정 후 커밋하기 -> EC2에서 작업할때도 동일하게 하면됨
   (1) 프로젝트 루트(graduation-project)로 이동 
   - cd C:\Users\leehk\graduation-project : 로컬
   - cd /opt/graduation-project : EC2

   (2) git status

   (3) git add .

   (4) git commit -m "커밋 메시지"

   (5) git push origin develop

   (5)-1 EC2에서 작업하는 경우 내 깃 닉네임과 액세스 토큰 입력


 3. 두개 이상의 브랜치 작성 후 합쳐야 할때 -> EC2에서 작업할때도 동일하게 하면됨 
  (여기서는 레이아웃 브랜치의 헤더/기본 레이아웃과 메인 페이지 브랜치의 메인 페이지를 합치는 경우를 예시로 듦)
  (전제: 레이아웃 브랜치(feature/frontend-layout)는 이미 2-(4) 과정을 통해 develop에 머지되어 있음)
  (0) 프로젝트 루트(graduation-project)로 이동 
  - cd C:\Users\leehk\graduation-project : 로컬
  - cd /opt/graduation-project : EC2

  (1) (선택) 혹시 develop이 그 사이에 원격에서 더 업데이트 되었을 수 있으니,
    merge 전에 한 번 develop을 최신으로 맞춰두면 안전하다.
    - git checkout develop
    - git pull origin develop

  (1)-1 EC2에서 작업하는 경우 내 깃 닉네임과 액세스 토큰 입력

  (2) 메인 페이지 브랜치로 이동
  - git checkout feature/frontend-main-page

  (3) 혹시 현재 브랜치(메인 페이지 브랜치)에서 작업 중인 파일이 있다면 먼저 커밋
  - git status
  - git add .
  - git commit -m "feat: 홈 메인 페이지 기본 섹션/스타일 추가"

  (4) 레이아웃 브랜치가 반영되어있는 develop 브랜치의 내용을 현재 브랜치(메인 페이지 브랜치)로 머지
  - git merge develop

  (5) 서버 실행
  - cd frontend
  - npm run dev

  => 즉, 예를 들어 레이아웃 브랜치에서 layouts/AppLayout/공통 컴포넌트 같은 공통 파일들을 수정했다면,
     그 변경사항을 먼저 develop 브랜치에 머지해 두고,
     메인 페이지 브랜치에서는 git merge develop을 통해
     develop에 반영된 최신 공통 코드들을 그대로 가져와서 그 위에서 이어서 작성한 뒤,
     작업이 끝나면 다시 develop 브랜치에 머지한다.
     이후 레이아웃 브랜치를 다시 수정할 일이 생기면, 
     항상 최신 develop 브랜치에서 새 레이아웃용 feature 브랜치를 따거나, 
     기존 레이아웃 브랜치에 develop을 머지한 뒤 그 위에서 이어서 작성한다.
     따라서 특정 브랜치에서 의미있는 수정이 발생한 파일들은 전부 add해서 develop에 머지해두고, 
     새로운 feature 브랜치를 딸 때마다, 그 시점의 develop에 있는 모든 Git 관리 파일들을 그대로 끌어오면된다.


 [Git 커밋 타입]
 1. feat: 새 기능 추가 (예: 로그인 페이지 추가, 검색 기능 구현 등)
 2. chore: 기타 잡일(폴더 정리 등 코드 기능과 직접 상관 없는 작업)
 3. build: 빌드/의존성/번들 설정 변경
 4. fix: 버그 수정
 5. docs: 문서만 변경
 6. style: 코드 동작은 그대로, 스타일/포맷만 변경
 7. refactor: 기능 변화 없이 내부 구조 개선(예: 컴포넌트 분리, 중복 함수 정리, 폴더 구조 개선)
 8. revert: 이전 커밋 되돌림


 [실행 순서]
 1. index.html
 2. main.tsx
 3. App.tsx
 4. src/router/index.tsx 
 5. AppLayout.tsx
 6. HomePage.tsx

 
 [각각의 파일들의 역할 - React(Vite + TypeScript) 버전]
 1. index.html
 - 맨 처음 로딩되는 껍데기(HTML)
 - 브라우저가 제일 먼저 받는 파일
 - 여기까지는 일반 HTML 파일
 
 2. main.tsx
 - React 앱 시작점(Entry)
 - ReactDOM.createRoot(...)로 #root에 <App />를 마운트함
 - 전역 CSS(index.css)도 보통 여기서 불러옴

 3. App.tsx
 - 루트 컴포넌트(React 앱 전체의 최상단 컴포넌트)
 - 전역 Provider(라우터/상태관리/테마 등)를 감싸거나, index.tsx에서 정의한 라우터 컴포넌트(AppRoutes 등)를 렌더링해서 앱 구조를 조립한다.
 - 이 프로젝트에서는 App.tsx가 src/router/index.tsx를 import해서 렌더링하는 구조다.
 
 4. src/router/index.tsx
 - URL <-> 페이지 매핑
 - 어떤 URL에 어떤 컴포넌트를 보여줄지 정의
 - 라우터 정의는 App.tsx에서 import해서 사용할 수도 있고, 다른 구조에서는 main.tsx에서 RouterProvider로 바로 렌더링할 수도 있다.
 - 여기선 라우터를 App.tsx에서 import해서 썼기 때문에 실행 흐름은 App.tsx -> src/router/index.tsx 이다.
 
 5. AppLayout.tsx
 - 공통 레이아웃(페이지들 위에 항상 씌워지는 공통 틀)
 - 상단 헤더/사이드바/하단 푸터 같은 공통 UI를 여기에 넣음
 
 6. HomePage.tsx
 - 실제 페이지 내용(화면 단위 컴포넌트)
 - 대시보드/키워드 상세/언론사 비교/문의/관리자 등 "페이지"는 전부 이런 패턴으로 구성
 - 페이지에서 필요한 섹션/카드/차트 컴포넌트를 조립해서 화면을 만듦
